services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iac
      POSTGRES_PASSWORD: iacpass
      POSTGRES_DB: iacdrift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iac -d iacdrift"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://iac:iacpass@db:5432/iacdrift
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
